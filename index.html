<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Démo LED industrielle</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0e14;color:#e8edf5;font-family:system-ui,"Segoe UI",sans-serif}
.panel{width:min(500px,calc(100% - 32px));padding:34px;text-align:center;background:linear-gradient(180deg,#171c25,#121720);border:1px solid #2b3342;border-radius:16px;box-shadow:0 18px 60px #0006,inset 0 1px 0 #ffffff08}
h1{margin:0;font-size:24px}
.led-assembly{width:33px;height:33px;margin:24px auto 14px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(145deg,#eef1f2 0%,#858b90 18%,#dfe3e5 35%,#5b6064 58%,#c9ced1 78%,#73797e 100%);box-shadow:0 2px 5px #000a,inset 0 1px 1px #fff,inset 0 -1px 2px #0008;position:relative}
.led-assembly::before{content:"";position:absolute;inset:4px;border-radius:50%;background:#090c0e;box-shadow:inset 0 1px 3px #000,inset 0 0 0 1px #ffffff10}
.led{position:relative;z-index:1;width:22px;height:22px;border-radius:50%;border:1px solid #000a;transition:.16s;background-clip:padding-box}
.off{background:radial-gradient(circle at 34% 28%,#5b6066 0 8%,#31363a 28%,#171a1d 74%);box-shadow:inset 0 -4px 6px #000b,inset 0 2px 3px #ffffff12}
.green{background:radial-gradient(circle at 34% 27%,#f2fff4 0 7%,#74ff9c 16%,#26d864 48%,#087d32 100%);box-shadow:inset 0 -4px 6px #00541a77,0 0 4px #20d060,0 0 9px #20d06099,0 0 16px #20d06033}
.orange{background:radial-gradient(circle at 34% 27%,#fff8e8 0 7%,#ffd675 16%,#ff9f1c 48%,#9b4f00 100%);box-shadow:inset 0 -4px 6px #6f330077,0 0 4px #ff9f1c,0 0 9px #ff9f1c99,0 0 16px #ff9f1c33}
.red{background:radial-gradient(circle at 34% 27%,#fff0f0 0 7%,#ff807a 16%,#e53935 48%,#82110e 100%);box-shadow:inset 0 -4px 6px #64000077,0 0 4px #e53935,0 0 9px #e5393599,0 0 16px #e5393533}
.status{margin-bottom:24px;color:#aeb8c8;font-size:14px}
.controls{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
button{padding:10px 15px;border:1px solid #394356;border-radius:9px;background:#202735;color:#eef2f8;font-weight:650;cursor:pointer;box-shadow:inset 0 1px 0 #ffffff0b}
button:hover{background:#2a3344}
button:active{transform:translateY(1px)}
.blink{animation:blink .7s steps(1) infinite}
@keyframes blink{50%{filter:brightness(.15);box-shadow:none}}
</style>
</head>
<body>
<main class="panel">
<h1>Test de LED</h1>
<div class="led-assembly"><div id="led" class="led off"></div></div>
<div class="status">État : <strong id="status">Éteinte</strong></div>
<div class="controls">
<button data-state="off">Éteindre</button>
<button data-state="green">Verte</button>
<button data-state="orange">Orange</button>
<button data-state="red">Rouge</button>
<button id="blink">Clignoter</button>
</div>
</main>
<script>
const led=document.querySelector('#led'),status=document.querySelector('#status'),blink=document.querySelector('#blink');
let state='off';
const labels={off:'Éteinte',green:'Verte',orange:'Orange',red:'Rouge'};
function setLed(s){state=s;led.className='led '+s;status.textContent=labels[s];blink.textContent='Clignoter'}
document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>setLed(b.dataset.state));
blink.onclick=()=>{if(state==='off')setLed('green');led.classList.toggle('blink');blink.textContent=led.classList.contains('blink')?'Stop clignot.':'Clignoter'};
</script>
</body>
</html>
