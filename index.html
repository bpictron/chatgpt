<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Démo LED</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0e14;color:#e8edf5;font-family:system-ui,"Segoe UI",sans-serif}.panel{width:min(520px,calc(100% - 32px));padding:36px;text-align:center;background:#151a23;border:1px solid #2b3342;border-radius:18px;box-shadow:0 18px 60px #0006}.holder{width:116px;height:116px;margin:28px auto 18px;display:grid;place-items:center;border-radius:50%;background:#090b0f;border:1px solid #313949;box-shadow:inset 0 4px 14px #000}.led{width:64px;height:64px;border-radius:50%;border:2px solid #0008;transition:.16s}.off{background:radial-gradient(circle at 35% 30%,#52565d,#2d3035 25%,#17191c 70%);box-shadow:inset 0 -8px 14px #000a}.green{background:radial-gradient(circle at 35% 28%,#effff3 0 6%,#64ff92 15%,#20d060 48%,#087d32);box-shadow:0 0 10px #20d060,0 0 28px #20d060cc,0 0 55px #20d06055}.orange{background:radial-gradient(circle at 35% 28%,#fff9e8 0 6%,#ffd166 15%,#ff9f1c 48%,#9b4f00);box-shadow:0 0 10px #ff9f1c,0 0 28px #ff9f1ccc,0 0 55px #ff9f1c55}.red{background:radial-gradient(circle at 35% 28%,#fff0f0 0 6%,#ff7772 15%,#e53935 48%,#82110e);box-shadow:0 0 10px #e53935,0 0 28px #e53935cc,0 0 55px #e5393555}.status{margin-bottom:25px;color:#aeb8c8}.controls{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}button{padding:10px 15px;border:1px solid #394356;border-radius:9px;background:#202735;color:#eef2f8;font-weight:650;cursor:pointer}button:hover{background:#2a3344}.blink{animation:blink .7s steps(1) infinite}@keyframes blink{50%{filter:brightness(.15);box-shadow:none}}
</style>
</head>
<body>
<main class="panel">
<h1>Test de LED</h1><div class="holder"><div id="led" class="led off"></div></div><div class="status">État : <strong id="status">Éteinte</strong></div>
<div class="controls"><button data-state="off">Éteindre</button><button data-state="green">Verte</button><button data-state="orange">Orange</button><button data-state="red">Rouge</button><button id="blink">Clignoter</button></div>
</main>
<script>
const led=document.querySelector('#led'),status=document.querySelector('#status'),blink=document.querySelector('#blink');let state='off';const labels={off:'Éteinte',green:'Verte',orange:'Orange',red:'Rouge'};function setLed(s){state=s;led.className='led '+s;status.textContent=labels[s];blink.textContent='Clignoter'}document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>setLed(b.dataset.state));blink.onclick=()=>{if(state==='off')setLed('green');led.classList.toggle('blink');blink.textContent=led.classList.contains('blink')?'Stop clignot.':'Clignoter'};
</script>
</body>
</html>
